<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pendaftaran asrlink</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <div class="form-card">

    <h1>Pendaftaran Instalasi Internet</h1>

    <p class="subtitle">
      Lengkapi data berikut untuk pemasangan internet
    </p>

    <form id="daftarForm">

      <div class="input-group">
        <label>Nama Lengkap</label>
        <input type="text" id="nama" required>
      </div>

      <div class="input-group">
        <label>Nomor WhatsApp</label>
        <input type="text" id="hp" required>
      </div>

      <div class="input-group">
        <label>Alamat Lengkap</label>
        <textarea id="alamat" required></textarea>
      </div>

      <div class="input-group">
        <label>Link Lokasi Google Maps</label>
        <input type="text" id="maps">
      </div>

      <div class="input-group">
        <label>Pilih Paket Internet</label>

        <select id="paket">

          <option>20 Mbps</option>
          <option>30 Mbps</option>
          <option>50 Mbps</option>
          <option>100 Mbps</option>

        </select>
      </div>

      <div class="input-group">
        <label>Catatan Tambahan</label>
        <textarea id="catatan"></textarea>
      </div>

      <button type="submit">
        Kirim Pendaftaran
      </button>

    </form>

  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script src="firebase.js"></script>
<script src="script.js"></script>

</body>
</html>
